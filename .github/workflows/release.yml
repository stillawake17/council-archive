# Builds the Windows installer and attaches it to a GitHub release.
# To publish version 1.2.3: put 1.2.3 in the VERSION file, commit, then push a tag named v1.2.3.
name: Build installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read version
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($version)"; exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m playwright install --only-shell chromium
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build program
        run: pyinstaller packaging/council-archive.spec --noconfirm
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash "dist\Council-Archive-Setup-$env:VERSION.exe" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Council-Archive-Setup-${{ env.VERSION }}
          path: dist/Council-Archive-Setup-${{ env.VERSION }}.exe
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Council-Archive-Setup-${{ env.VERSION }}.exe
          generate_release_notes: true
